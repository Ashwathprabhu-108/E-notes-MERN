<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6AD55" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>
  </defs>
  <!-- Cap Base / Underneath -->
  <path d="M16,38 Q32,46 48,38 L48,46 Q32,54 16,46 Z" fill="#2D3748" />
  <path d="M20,41 L20,47 Q32,54 44,47 L44,41 Q32,48 20,41 Z" fill="#718096" opacity="0.3" />
  <!-- Skull Cap -->
  <path d="M18,36 C18,36 22,46 32,46 C42,46 46,36 46,36 L46,42 C46,42 42,48 32,48 C22,48 18,42 18,42 Z" fill="url(#capGrad)" />
  <!-- Diamond Top -->
  <polygon points="32,16 58,28 32,40 6,28" fill="url(#capGrad)" stroke="#2D3748" stroke-width="0.5" />
  <polygon points="32,18 54,28 32,38 10,28" fill="#4A5568" opacity="0.15" />
  <!-- Tassel Button -->
  <ellipse cx="32" cy="28" rx="2.5" ry="1.5" fill="url(#tasselGrad)" />
  <!-- Tassel String and Ribbon -->
  <path d="M32,28 Q44,30 48,37" fill="none" stroke="url(#tasselGrad)" stroke-width="2" stroke-linecap="round" />
  <polygon points="48,36 46,48 51,48 49,36" fill="url(#tasselGrad)" />
</svg>
